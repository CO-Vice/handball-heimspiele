name: Heimspiele aktualisieren

on:
  schedule:
    # täglich 05:12 UTC. Krumme Minute, damit der Lauf nicht in der
    # Stoßzeit der GitHub-Runner hängen bleibt.
    - cron: "12 5 * * *"
  workflow_dispatch:        # Knopf zum manuellen Auslösen
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Spielpläne einsammeln
        run: python collect_heimspiele.py

      - name: Auf Jugendbundesliga schauen
        run: python watch_jblh.py || true

      - name: Seite bauen
        run: python build_site.py

      - name: Datenstand sichern
        run: |
          git config user.name  "heimspiele-bot"
          git config user.email "bot@users.noreply.github.com"
          git add heimspiele.json
          git diff --staged --quiet || git commit -m "Spielplan-Update $(date +%F)"
          git push

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
